[package]
name = "revdeprun"
version = "2.3.0"
edition = "2024"
rust-version = "1.85"
description = "Easy reverse dependency checks for R with cloud-ready environment setup"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nanxstats/revdeprun"
documentation = "https://nanx.me/revdeprun/"
keywords = ["R-packages", "integration-testing", "reverse-dependency"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Nan Xiao <me@nanx.me>"]
exclude = [
    "AGENTS.md",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    "site/",
    "docs/",
    "zensical.toml",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
indicatif = "0.18.6"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
xshell = "0.2.7"
